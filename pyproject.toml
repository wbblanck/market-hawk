[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"
[project]
name = "nfl-market-intelligence"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2","numpy>=1.26","pydantic>=2.7","pydantic-settings>=2.2","duckdb>=1.0","pyarrow>=16.0","scikit-learn>=1.5","streamlit>=1.36","plotly>=5.22","httpx>=0.27","python-dotenv>=1.0"]
[project.optional-dependencies]
mcp = ["mcp>=1.0"]
models = ["lightgbm>=4.3","xgboost>=2.0"]
dev = ["pytest>=8.2","pytest-cov>=5.0","ruff>=0.5"]
[project.scripts]
nflmi = "nfl_market.cli:main"
nflmi-mcp = "nfl_market.mcp_server.server:main"
[tool.hatch.build.targets.wheel]
packages = ["src/nfl_market"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
